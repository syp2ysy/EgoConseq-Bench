model_name: Qwen/Qwen3-VL-4B-Instruct
output_dir: outputs/qwen3vl_r2r_rxr

annotation_path:
  - /data/zhangshan/StreamVLN-Trajectory-Data-ZIP/R2R/annotations_v1-3.json
  - /data/zhangshan/StreamVLN-Trajectory-Data-ZIP/RxR/annotations.json
image_root:
  - /data/zhangshan/StreamVLN-Trajectory-Data-ZIP/R2R/images
  - /data/zhangshan/StreamVLN-Trajectory-Data-ZIP/RxR/images

history_images: 8
max_action_segments: 3
chunking_strategy: navida_random
chunking_seed: 41
chunking_merge_probability: 0.7
image_size: [308, 252]
stop_upsample_ratio: 2

seed: 42
num_train_epochs: 1
learning_rate: 2.0e-5
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
lr_scheduler_type: cosine
bf16: true
attn_implementation: flash_attention_2
gradient_checkpointing: true
dataloader_num_workers: 4
dataloader_pin_memory: true
logging_steps: 5
eval_strategy: "no"
eval_steps: 100
save_strategy: "no"
save_steps: 12000
report_to: tensorboard
deepspeed: scripts/zero2.json

freeze_vision_encoder: true
train_visual_merger: true
