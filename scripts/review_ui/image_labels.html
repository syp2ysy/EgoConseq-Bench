<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>图片质量 · 人工确认</title>
<style>
:root{color-scheme:light;--ink:#202b30;--muted:#627078;--line:#d8dfdf;--keep:#237365;--reject:#b34c35;--paper:#f4f5f1}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Noto Sans SC",sans-serif}
button,select,input{font:inherit}button,select{border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--ink)}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #d89e42;outline-offset:2px}button:disabled{opacity:.4;cursor:default}
header{max-width:1560px;margin:auto;padding:30px 28px 18px}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--muted)}h1{font-size:30px;margin:3px 0 8px;font-weight:650;letter-spacing:-.03em}
.intro{display:flex;gap:28px;align-items:end;justify-content:space-between}.intro p{margin:0;max-width:940px}.counter{text-align:right;white-space:nowrap}.counter b{font-size:30px;font-weight:500}.counter small{display:block;color:var(--muted)}
.rules{margin-top:18px;border-left:3px solid var(--reject);padding:7px 14px;background:#fff}.rules strong{color:var(--reject)}.rules span{display:block;color:var(--muted)}
.toolbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#f4f5f1f2;border-block:1px solid var(--line);padding:12px max(28px,calc((100vw - 1504px)/2));backdrop-filter:blur(12px)}
.toolbar label{display:flex;align-items:center;gap:8px}.toolbar input[type=text]{width:120px;background:white;border:1px solid var(--line);border-radius:5px;padding:7px}.spacer{flex:1}.primary{background:var(--ink);color:white;border-color:var(--ink)}
main{max-width:1560px;padding:24px 28px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{background:white;border:1px solid var(--line);border-radius:9px;overflow:hidden}.card:focus-within{box-shadow:0 0 0 2px #d89e42}.card[data-state=keep]{border-color:var(--keep)}.card[data-state=reject]{border-color:var(--reject)}
.picture{display:block;padding:0;border:0;border-radius:0;background:#152025;width:100%;position:relative}.picture img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain}.picture:hover:after{content:'点击放大';position:absolute;bottom:12px;right:12px;color:white;background:#0009;padding:3px 10px;border-radius:3px;font-size:12px}
.meta{display:flex;justify-content:space-between;padding:10px 14px 4px;color:var(--muted);font-size:12px;letter-spacing:.04em}.actions{display:flex;gap:8px;padding:8px 14px 14px}.actions button{flex:1;padding:9px 4px}.actions .clear{flex:0;padding-inline:10px}.card[data-state=keep] .keep{background:var(--keep);border-color:var(--keep);color:white}.card[data-state=reject] .reject{background:var(--reject);border-color:var(--reject);color:white}
.reason{display:block;width:calc(100% - 28px);margin:0 14px 14px;font-size:13px;padding:5px 8px}.footer{display:flex;align-items:center;justify-content:center;gap:20px;margin:28px 0}.empty{grid-column:1/-1;text-align:center;padding:80px;color:var(--muted)}#notice{max-width:1504px;margin:0 auto;color:var(--muted);font-size:13px;padding:8px 28px}dialog{padding:0;border:0;border-radius:10px;max-width:96vw;width:1000px;background:var(--paper)}dialog::backdrop{background:#07131cdb}dialog img{display:block;max-height:78vh;max-width:100%;width:100%;object-fit:contain;background:#152025}dialog .actions{justify-content:center}dialog .actions button{flex:0 1 180px}.modal-meta{padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.card[data-state=uncertain]{border-color:#aa8540}.card[data-state=uncertain] .uncertain{background:#f9efd8;border-color:#aa8540;color:#79581b}.steps{display:flex;gap:20px;color:var(--muted);font-size:13px;margin-top:14px}.steps b{color:var(--ink)}progress{display:block;width:100%;height:5px;accent-color:var(--keep);margin-top:10px}.actions button{font-size:14px}.counter{min-width:235px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.intro{align-items:start}header,main{padding-inline:18px}.toolbar{padding-inline:18px}}
@media(max-width:620px){.grid{grid-template-columns:1fr}.intro{display:block}.counter{text-align:left;margin-top:12px}.counter b{font-size:23px}h1{font-size:25px}.toolbar{gap:8px}.toolbar .spacer{display:none}.toolbar label{font-size:13px}.toolbar input[type=text]{width:90px}main{padding-top:16px}.actions button{min-height:44px}}
</style>
<header><div class="eyebrow">IMAGE REVIEW / 图像筛选</div><div class="intro"><div><h1>只剔除严重异常</h1><p>只看图片，不需要检查题目和答案。点击图片可以放大；拿不准就单独标记，不必勉强判断。</p><div class="steps"><span><b>01</b> 看原图</span><span><b>02</b> 点一个标签</span><span><b>03</b> 导出 CSV 发回</span></div></div><div class="counter"><b id="progress">0 / 0</b><progress id="bar" max="1" value="0" aria-label="已查看图片进度"></progress><small id="counts">标注保存在当前浏览器</small></div></div><div class="rules"><strong>剔除：</strong>大面积碎裂、明显拉伸、大片异常缺面，或非物理碎片严重破坏场景结构。<span>保留：局部小洞、黑缝、轻微扫描瑕疵、正常贴脸、白墙、暗色物体、普通模糊、低模或风格化资产。黑色或平涂本身不是异常。</span></div></header>
<div class="toolbar"><label>数据集 <select id="dataset"><option value="">全部</option><option value="r2r">R2R</option><option value="gs">GS</option><option value="b1k">B1K</option></select></label><label>状态 <select id="state"><option value="">全部图片</option><option value="pending">还没看</option><option value="uncertain">拿不准</option><option value="keep">保留</option><option value="reject">严重异常</option></select></label><label>标注人 <input id="reviewer" type="text" placeholder="名字或代号" aria-label="标注人" maxlength="80"></label><span class="spacer"></span><button id="export" class="primary">导出标注 CSV ↓</button></div>
<p id="notice" role="status">自动保存在当前浏览器，可以中途停下。选中图片后按 1 保留、2 严重异常、3 拿不准。</p>
<main><div id="grid" class="grid"></div><div class="footer"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></main>
<dialog id="zoom"><div class="modal-meta"><span id="zoom-label"></span><button id="close">关闭 · Esc</button></div><img id="large" alt="待审原图"><div class="actions"><button id="zoom-keep">1 · 保留</button><button id="zoom-reject">2 · 严重异常</button><button id="zoom-uncertain">3 · 拿不准</button></div></dialog>
<script src="items.js"></script>
<script>
const $=id=>document.getElementById(id), states={keep:'已保留',reject:'严重异常',uncertain:'拿不准',pending:'还没看'};
const signature=ITEMS.reduce((n,r)=>{for(const c of r.image_sha256)n=Math.imul(n^c.charCodeAt(0),16777619);return n},2166136261)>>>0;
const storage=`image-labels:${location.pathname}:${signature}`, size=12;
let labels={},page=0,active=null;
try{labels=JSON.parse(localStorage.getItem(storage)||'{}');$('reviewer').value=localStorage.getItem(storage+':reviewer')||''}catch(e){$('notice').textContent='本地存储不可用，请及时导出标注。'}
function filtered(){return ITEMS.filter(r=>(!$('dataset').value||r.dataset===$('dataset').value)&&(!$('state').value||($('state').value==='pending'?!labels[r.image_sha256]:labels[r.image_sha256]?.decision===$('state').value)))}
function save(){try{localStorage.setItem(storage,JSON.stringify(labels));localStorage.setItem(storage+':reviewer',$('reviewer').value)}catch(e){$('notice').textContent='保存失败，请立即导出标注 CSV。'}}
function setLabel(sha,decision){if(decision)labels[sha]={decision,reason:decision==='reject'?'render_artifact':decision==='uncertain'?'uncertain':'normal_or_mild',reviewed_at:new Date().toISOString()};else delete labels[sha];save();render();$('grid').querySelector(`[data-sha="${sha}"] [data-action="${decision||'clear'}"]`)?.focus({preventScroll:true})}
function render(){const rows=filtered(),total=Math.max(1,Math.ceil(rows.length/size));page=Math.max(0,Math.min(page,total-1));const count=d=>ITEMS.filter(r=>labels[r.image_sha256]?.decision===d).length,keep=count('keep'),reject=count('reject'),uncertain=count('uncertain');$('progress').textContent=`${keep+reject+uncertain} / ${ITEMS.length} 已看`;$('bar').max=ITEMS.length||1;$('bar').value=keep+reject+uncertain;$('counts').textContent=`保留 ${keep} · 严重异常 ${reject} · 拿不准 ${uncertain}`;$('page').textContent=`${page+1} / ${total} 页 · ${rows.length} 张`;$('prev').disabled=page===0;$('next').disabled=page===total-1;
  $('grid').innerHTML=rows.slice(page*size,(page+1)*size).map(r=>{const sha=r.image_sha256,label=labels[sha],index=ITEMS.indexOf(r),state=label?.decision||'pending';return `<article class="card" data-sha="${sha}" data-state="${state}"><button class="picture" data-action="zoom" aria-label="放大图像 ${index+1}"><img src="${encodeURI(r.image)}" loading="lazy" alt="待审原图 ${index+1}"></button><div class="meta"><span>${String(index+1).padStart(3,'0')} / ${r.dataset.toUpperCase()}</span><span>${states[state]}</span></div><div class="actions">${[['keep','保留'],['reject','严重异常'],['uncertain','拿不准']].map(([d,t])=>`<button class="${d}" data-action="${d}" aria-pressed="${state===d}">${t}</button>`).join('')}<button class="clear" data-action="clear" aria-label="清空标注">↺</button></div></article>`}).join('')||'<p class="empty">当前筛选下没有图像。</p>'}
$('grid').addEventListener('focusin',e=>{active=e.target.closest('.card')?.dataset.sha||active});
$('grid').addEventListener('click',e=>{const card=e.target.closest('.card'),button=e.target.closest('button');if(!card||!button)return;active=card.dataset.sha;const action=button.dataset.action;if(action==='zoom'){const r=ITEMS.find(x=>x.image_sha256===active);$('large').src=r.image;$('zoom-label').textContent=`图像 ${ITEMS.indexOf(r)+1} · ${r.dataset.toUpperCase()}`;$('zoom').showModal()}else setLabel(active,action==='clear'?null:action)});
$('grid').addEventListener('error',e=>{if(e.target.tagName==='IMG'){$('notice').textContent='有图片加载失败，请刷新或检查服务；不要将加载失败标成坏图。';for(const b of e.target.closest('.card').querySelectorAll('.actions button'))b.disabled=true}},true);
for(const id of ['dataset','state'])$(id).onchange=()=>{page=0;active=null;render()};$('reviewer').oninput=save;
$('prev').onclick=()=>{page--;active=null;render();window.scrollTo(0,0)};$('next').onclick=()=>{page++;active=null;render();window.scrollTo(0,0)};$('close').onclick=()=>$('zoom').close();
for(const decision of ['keep','reject','uncertain'])$('zoom-'+decision).onclick=()=>{$('zoom').close();setLabel(active,decision)};
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea')||!active||e.ctrlKey||e.metaKey||e.repeat)return;const decision={'1':'keep','k':'keep','2':'reject','r':'reject','3':'uncertain','u':'uncertain'}[e.key.toLowerCase()];if(decision){e.preventDefault();if($('zoom').open)$('zoom').close();setLabel(active,decision)}});
$('export').onclick=()=>{const reviewer=$('reviewer').value.trim();if(!reviewer){$('notice').textContent='请先填写标注人姓名或代号。';$('reviewer').focus();return}const rows=ITEMS.filter(r=>labels[r.image_sha256]).map(r=>{const v=labels[r.image_sha256];return [r.image_sha256,v.decision==='uncertain'?'':v.decision,v.reason,'human',reviewer,v.reviewed_at||'']});if(!rows.length){$('notice').textContent='尚无标注可导出。';return}const csv=[['image_sha256','decision','reason','source','annotator','reviewed_at'],...rows].map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`image_labels_${ITEMS.length}_${new Date().toISOString().slice(0,10)}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('notice').textContent=`已导出 ${rows.length} 张标注（其中 ${rows.filter(r=>!r[1]).length} 张拿不准）。拿不准的不会作为保留标签；请把下载的 CSV 发回。`};
render();
</script>
</html>
