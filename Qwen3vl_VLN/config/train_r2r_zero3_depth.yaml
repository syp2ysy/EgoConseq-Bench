model_name: Qwen/Qwen3-VL-4B-Instruct
output_dir: outputs/qwen3vl_streamvln_r2r_depth_zero3

annotation_path:
  - /home/zhangshan/syp/datasets/StreamVLN-Trajectory-Data/R2R/annotations_v1-3.json
image_root:
  - /home/zhangshan/syp/datasets/StreamVLN-Trajectory-Data/R2R/images

history_images: 8
max_action_segments: 3
chunking_strategy: navida_random
chunking_seed: 41
chunking_merge_probability: 0.7
image_size: [308, 252]
stop_upsample_ratio: 2

depth_enable: true
depth_root:
  - /home/zhangshan/syp/datasets/StreamVLN-Trajectory-Data/R2R/images
depth_weight: 0.1
depth_warmup_steps: 100
depth_tap_layer: 24
depth_max_meters: 10.0
depth_head_hidden_dim: 512
depth_head_patch: 1
depth_silog_alpha: 10.0
depth_silog_variance_focus: 0.85
depth_min_valid_pixels: 16

seed: 41
num_train_epochs: 1
learning_rate: 5.0e-6
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
lr_scheduler_type: cosine
bf16: true
attn_implementation: flash_attention_2
gradient_checkpointing: true
dataloader_num_workers: 4
dataloader_pin_memory: true
logging_steps: 5
logging_nan_inf_filter: false
max_grad_norm: 0.5
save_strategy: steps
save_steps: 100
save_total_limit: 3
report_to: none
deepspeed: scripts/zero3.json
resume_model_only: true

freeze_vision_encoder: true
train_visual_merger: true
